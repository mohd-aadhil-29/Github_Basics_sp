<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Login Page</title>

<style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f0f2f5; }

.login-box { width: 350px; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15); }

h1 { text-align: center; margin-bottom: 25px; color: #333; }

label { display: block; margin-bottom: 5px; color: #555; }

input { width: 100%; padding: 12px; margin-bottom: 18px; border: 1px solid #ccc; border-radius: 5px; }

button { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #2563eb; color: white; font-size: 16px; cursor: pointer; }

button:hover { background: #1d4ed8; } </style> </head>

<body>

<div class="login-box"> <h1>Login</h1>

<form> <label for="email">Email</label> <input type="email" id="email" placeholder="Enter your email">

<label for="password">Password</label> <input type="password" id="password" placeholder="Enter your password">

<button type="submit">Login</button> </form> </div>

</body> </html>
